<!doctype html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://gfeqsvefeifltjhxswor.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ibe-v4hrhD6Cb2ggYCwdnQ_uglELvkK';

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel — Free Fire Store</title>
<style>
:root{
  --bg:#07080d; --card:#11131b; --card2:#171a24; --red:#ff1744;
  --yellow:#ffd600; --text:#fff; --muted:#a8adbd; --line:#282c3a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,Arial,sans-serif;background:
  radial-gradient(circle at 15% 5%,#32101c 0,transparent 28%),
  radial-gradient(circle at 85% 10%,#1c1d42 0,transparent 30%),var(--bg);
  color:var(--text);line-height:1.5;
}
a{text-decoration:none;color:inherit}
.container{width:min(1120px,92%);margin:auto}
nav{position:sticky;top:0;z-index:20;background:rgba(7,8,13,.86);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:900;letter-spacing:.5px}
.logo span{color:var(--yellow)}
.navlinks{display:flex;gap:24px;color:#ddd}
.navlinks a:hover{color:var(--yellow)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;
  border-radius:12px;font-weight:800;border:1px solid transparent;cursor:pointer}
.btn-red{background:linear-gradient(135deg,#ff1744,#c5002d);box-shadow:0 10px 30px #ff17442e}
.btn-yellow{background:var(--yellow);color:#111}
.btn-outline{border-color:#45495a;background:#11131b}
.hero{padding:90px 0 60px;text-align:center}
.badge{display:inline-block;padding:7px 13px;border:1px solid #4c4250;border-radius:99px;
  color:var(--yellow);background:#171019;font-weight:800;font-size:13px}
h1{font-size:clamp(44px,8vw,86px);line-height:.95;margin:22px 0 20px;
  text-transform:uppercase}
h1 span{color:var(--yellow);text-shadow:0 0 30px #ffd60033}
.hero p{max-width:720px;margin:auto;color:var(--muted);font-size:18px}
.actions{margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:45px 0}
.stat{background:linear-gradient(145deg,#151822,#0d0f15);border:1px solid var(--line);
  border-radius:18px;padding:22px;text-align:center}
.stat b{display:block;font-size:25px;color:var(--yellow)}
.stat small{color:var(--muted)}
section{padding:55px 0}
.section-title{text-align:center;margin-bottom:35px}
.section-title h2{font-size:36px}
.section-title p{color:var(--muted);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:linear-gradient(145deg,#141720,#0d0f15);border:1px solid var(--line);
  border-radius:20px;padding:26px;position:relative;overflow:hidden}
.card.popular{border-color:#ff1744;box-shadow:0 0 35px #ff174414}
.ribbon{position:absolute;right:15px;top:15px;background:var(--red);padding:5px 10px;
  border-radius:99px;font-size:11px;font-weight:900}
.price{font-size:40px;font-weight:900;margin:16px 0}
.price small{font-size:14px;color:var(--muted)}
.features{list-style:none;margin:20px 0}
.features li{padding:9px 0;border-bottom:1px solid #242733;color:#ddd}
.features li::before{content:"✓";color:var(--yellow);font-weight:900;margin-right:9px}
.card .btn{width:100%}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.feature{padding:22px;border:1px solid var(--line);border-radius:17px;background:#10121a}
.icon{font-size:28px;margin-bottom:10px}
.feature h3{font-size:17px}.feature p{color:var(--muted);font-size:14px;margin-top:6px}
.faq{max-width:820px;margin:auto}
details{background:#11131b;border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:17px}
summary{cursor:pointer;font-weight:800}
details p{color:var(--muted);padding-top:12px}
.order{background:linear-gradient(135deg,#220914,#15101a);border:1px solid #5a1d2d;
  border-radius:24px;padding:40px;text-align:center}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);text-align:center}
.note{font-size:12px;color:#777;margin-top:18px}
@media(max-width:800px){
  .navlinks{display:none}.stats,.grid,.feature-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
  .stats,.grid,.feature-grid{grid-template-columns:1fr}
  .hero{padding-top:60px}.order{padding:28px 18px}
}

.order-form{max-width:760px;margin:28px auto 0;text-align:left}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:800;color:#ddd}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;border-radius:11px;border:1px solid #343847;
  background:#0b0d13;color:#fff;outline:none;font:inherit
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#ffd600}
.field textarea{min-height:90px;resize:vertical}
.order-result{display:none;margin-top:18px;padding:18px;border:1px solid #3b4655;
  border-radius:14px;background:#0b1016}
.order-result strong{color:var(--yellow)}
.status{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:99px;
  background:#332900;color:var(--yellow);font-size:12px;font-weight:900}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}

.payment-box{max-width:760px;margin:24px auto 0;text-align:left}
.payment-methods{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:15px 0}
.pay-method{padding:12px 7px;border:1px solid #343847;border-radius:11px;background:#0b0d13;
  color:#ddd;text-align:center;font-weight:800;cursor:pointer}
.pay-method.active{border-color:var(--yellow);color:var(--yellow);box-shadow:0 0 18px #ffd60018}
.payment-info{display:none;background:#0b0d13;border:1px solid #343847;border-radius:14px;padding:18px;margin-top:12px}
.payment-info.show{display:block}
.payment-number{font-size:21px;font-weight:900;color:var(--yellow);margin:6px 0}
.copy-btn{padding:7px 10px;border:1px solid #444957;border-radius:8px;background:#171a24;color:#fff;cursor:pointer}
.payment-warning{font-size:12px;color:#9da2b2;margin-top:10px}
.verify-box{margin-top:18px;padding-top:18px;border-top:1px solid #292d39}
.download-box{display:none;margin-top:18px;padding:18px;border:1px solid #384b3d;
  background:#0c1510;border-radius:14px}
.download-box.show{display:block}
@media(max-width:700px){.payment-methods{grid-template-columns:repeat(3,1fr)}}

.admin-panel{display:none;max-width:980px;margin:24px auto 0;text-align:left}
.admin-login{max-width:430px;margin:0 auto}
.admin-table-wrap{overflow-x:auto;margin-top:18px}
.admin-table{width:100%;border-collapse:collapse;min-width:760px}
.admin-table th,.admin-table td{padding:11px;border-bottom:1px solid #292d39;text-align:left;font-size:13px}
.admin-table th{color:var(--yellow)}
.order-row{background:#0c0e14}
.admin-actions{display:flex;gap:7px;flex-wrap:wrap}
.small-btn{padding:7px 10px;border-radius:8px;border:1px solid #3d4251;background:#171a24;color:#fff;cursor:pointer;font-weight:700}
.small-btn.approve{border-color:#426f4c}
.small-btn.reject{border-color:#6f4242}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.admin-stat{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<!-- Admin is intentionally separated from the public storefront.
     This is a frontend-only demo; production authentication must be server-side. -->

<header class="nav">
  <div class="logo">FREE FIRE <span>PANEL</span> ADMIN</div>
  <a class="btn" href="free_fire_panel_store.html">Back to Store</a>
</header>

<main style="max-width:1200px;margin:100px auto 40px;padding:20px;">
<section id="admin">
<div class="container">
  <div class="order">
    <div class="section-title" style="margin-bottom:18px">
      <h2>Admin Order Panel</h2>
      <p>Manually review payment and approve orders before file delivery.</p>
    </div>

    <div class="admin-login" id="adminLogin">
      <div class="field">
  <label for="adminEmail">Admin Email</label>
  <input id="adminEmail" type="email" placeholder="Enter admin email">
</div>
      <div class="field">
        <label for="adminPassword">Admin Password</label>
        <input id="adminPassword" type="password" placeholder="Enter admin password">
      </div>
      <button class="btn btn-red" id="adminLoginBtn" style="width:100%;margin-top:12px">Admin Login</button>
      <p class="note">Login with your Supabase admin account.</p>
    </div>

    <div class="admin-panel" id="adminPanel">
      <div class="admin-head">
        <div>
          <h3>Orders</h3>
          <div class="admin-stat" id="adminStats">0 orders</div>
        </div>
        <div class="admin-actions">
          <button class="small-btn" id="refreshOrders">Refresh</button>
          <button class="small-btn" id="logoutAdmin">Logout</button>
        </div>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Order ID</th><th>Package</th><th>Customer</th><th>Payment</th>
              <th>Transaction ID</th><th>Status</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</section>
</main>

<script>

const $ = (id) => document.getElementById(id);
const getOrders = () => {
  try { return JSON.parse(localStorage.getItem('ffp_orders') || '[]'); }
  catch(e) { return []; }
};
const saveOrders = (orders) => localStorage.setItem('ffp_orders', JSON.stringify(orders));

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

async function renderOrders() {
  const { data: orders, error } = await supabaseClient
    .from('orders')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error(error);
    $('adminStats').textContent = 'Error loading orders';
    $('ordersBody').innerHTML =
      '<tr><td colspan="7" style="text-align:center;color:#ff8f8f;padding:28px">Failed to load orders.</td></tr>';
    return;
  }

  $('adminStats').textContent =
    `${orders.length} order${orders.length === 1 ? '' : 's'}`;

  if (!orders.length) {
    $('ordersBody').innerHTML =
      '<tr><td colspan="7" style="text-align:center;color:#9da2b2;padding:28px">No orders yet.</td></tr>';
    return;
  }

  $('ordersBody').innerHTML = orders.map(o => {
    const status = o.order_status || 'Pending';
    const approved = status === 'Approved';
    const rejected = status === 'Rejected';

    let action = '';

    if (approved) {
      action = '<span class="small-btn" style="border-color:#426f4c;color:#7dff9a;cursor:default">Approved</span>';
    } else if (rejected) {
      action = '<span class="small-btn" style="border-color:#6f4242;color:#ff8f8f;cursor:default">Rejected</span>';
    } else {
      action = `
        <div class="admin-actions">
          <button class="small-btn approve" onclick="approveOrder('${escapeHtml(o.order_id)}')">Approve</button>
          <button class="small-btn reject" onclick="rejectOrder('${escapeHtml(o.order_id)}')">Reject</button>
        </div>`;
    }

    return `
      <tr class="order-row">
        <td>
          <b>${escapeHtml(o.order_id || '-')}</b><br>
          <span style="color:#9da2b2">${escapeHtml(o.created_at || '')}</span>
        </td>

        <td>
          ${escapeHtml(o.package_name || '-')}<br>
          <span style="color:#ffd600">৳${escapeHtml(o.amount || '')}</span>
        </td>

        <td>
          ${escapeHtml(o.customer_name || '-')}<br>
          <span style="color:#9da2b2">${escapeHtml(o.contact || '')}</span><br>
          UID: ${escapeHtml(o.game_uid || '-')}
        </td>

        <td>
          ${escapeHtml(o.payment_method || '-')}<br>
          <span style="color:#9da2b2">${escapeHtml(o.payer_number || '')}</span>
        </td>

        <td>${escapeHtml(o.transaction_id || '-')}</td>

        <td>${escapeHtml(status)}</td>

        <td>${action}</td>
      </tr>`;
  }).join('');
}

function approveOrder(index) {
  const orders = getOrders();
  if (!orders[index]) return;

  orders[index].status = 'APPROVED — READY FOR DELIVERY';
  orders[index].approvedAt = new Date().toLocaleString();
  saveOrders(orders);
  renderOrders();
  alert('Order approved. Customer main page will now show the ZIP download.');
}

function rejectOrder(index) {
  const orders = getOrders();
  if (!orders[index]) return;

  orders[index].status = 'REJECTED';
  orders[index].rejectedAt = new Date().toISOString();
  saveOrders(orders);
  renderOrders();
  alert('Order rejected.');
}

async function loginAdmin() {
  const email = $('adminEmail').value.trim();
  const password = $('adminPassword').value;

  if (!email || !password) {
    alert('Please enter email and password.');
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert('Login failed: ' + error.message);
    return;
  }

  $('adminLogin').style.display = 'none';
  $('adminPanel').style.display = 'block';
  renderOrders();
}

function logoutAdmin() {
  sessionStorage.removeItem('ffp_admin_logged_in');
  $('adminPanel').style.display = 'none';
  $('adminLogin').style.display = 'block';
  $('adminPassword').value = '';
}

$('adminLoginBtn').addEventListener('click', loginAdmin);


$('refreshOrders').addEventListener('click', renderOrders);
$('logoutAdmin').addEventListener('click', logoutAdmin);


window.addEventListener('storage', (e) => {
  if (e.key === 'ffp_orders') renderOrders();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && $('adminPanel').style.display !== 'none') renderOrders();
});

$('refreshOrders').addEventListener('click', renderOrders);
$('logoutAdmin').addEventListener('click', () => {
  $('adminPanel').style.display='none';
  $('adminLogin').style.display='block';
  $('adminPassword').value='';
});
window.addEventListener('storage', renderOrders);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderOrders(); });
setInterval(renderOrders, 1500);
</script>
</body>
</html>
